<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تأكيد الحذف</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: #f5f5f5; }
        .box { background: white; padding: 25px; max-width: 450px;
               border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        h2 { color: #e74c3c; }
        button {
            padding: 10px 22px; background: #e74c3c; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 15px;
        }
        a { display: inline-block; padding: 10px 22px; background: #7f8c8d;
            color: white; text-decoration: none; border-radius: 4px; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>⚠️ تأكيد الحذف</h2>
        <p>هل تريد حذف مقابلة <b>{{ object.name }}</b>؟</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">نعم، احذف</button>
            <a href="{% url 'interview-list' %}">إلغاء</a>
        </form>
    </div>
</body>
</html>
