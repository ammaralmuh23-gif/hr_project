<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}تعديل{% else %}إضافة{% endif %} مقابلة</title>
    <style>
        body { font-family: Tahoma; padding: 20px; background: #f5f5f5; }
        form { background: white; padding: 25px; max-width: 550px;
               border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        h2 { color: #2c3e50; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        input[type="text"], input[type="email"], input[type="date"], select, textarea {
            width: 100%; padding: 9px; border: 1px solid #ccc;
            border-radius: 4px; font-family: Tahoma; font-size: 14px; box-sizing: border-box;
        }
        /* هذا السطر هو اللي يخلي التاريخ ديناميكي (تقويم) */
        input[type="date"] { direction: ltr; } 
        
        button {
            padding: 10px 22px; background: #27ae60; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 15px;
            margin-top: 10px;
        }
        .cancel {
            display: inline-block; padding: 10px 22px; background: #7f8c8d;
            color: white; text-decoration: none; border-radius: 4px; margin-right: 8px;
        }
    </style>
</head>
<body>
    <h2>{% if object %}✏️ تعديل مقابلة{% else %}➕ إضافة مقابلة{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}:</label>
                {# إذا كان الحقل هو تاريخ المقابلة، نخليه تقويم ديناميكي #}
                {% if field.name == 'interview_date' %}
                    <input type="date" name="{{ field.name }}" value="{{ field.value|date:'Y-m-d' }}" required>
                {% else %}
                    {{ field }}
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit">💾 حفظ</button>
        <a href="{% url 'interview-list' %}" class="cancel">إلغاء</a>
    </form>
</body>
</html>
