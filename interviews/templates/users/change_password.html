<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تغيير كلمة المرور</title>
    <style>
        body { font-family: Tahoma; background: #f5f5f5; padding: 20px; display: flex; justify-content: center; }
        .box { background: white; padding: 30px; border-radius: 10px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn-cancel { background: #95a5a6; margin-top: 5px; text-align: center; text-decoration: none; display: block; color: white; padding: 12px; border-radius: 5px; }
        .helptext { font-size: 12px; color: #7f8c8d; display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>تغيير كلمة مرور: {{ user_obj.username }}</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}:</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text }}</span>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit">حفظ كلمة المرور الجديدة</button>
            <a href="{% url 'user-list' %}" class="btn-cancel">إلغاء</a>
        </form>
    </div>
</body>
</html>
