<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تعديل بيانات المستخدم</title>
    <style>
        body { font-family: Tahoma; background: #f5f5f5; padding: 20px; display: flex; justify-content: center; }
        .box { background: white; padding: 30px; border-radius: 10px; width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .old-pass { background: #f1f2f6; color: #e74c3c; font-weight: bold; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn-cancel { background: #95a5a6; margin-top: 5px; text-align: center; text-decoration: none; display: block; color: white; padding: 12px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>✏️ تعديل بيانات: {{ user_obj.username }}</h2>
        
        <div class="old-pass">
            كلمة المرور الحالية: {{ user_obj.profile.plain_password|default:"غير مسجلة" }}
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>اسم المستخدم:</label>
                <input type="text" name="username" value="{{ user_obj.username }}" required>
            </div>
            
            <div class="form-group">
                <label>كلمة المرور الجديدة (اتركها فارغة إذا لا تريد تغييرها):</label>
                <input type="text" name="password" placeholder="اكتب كلمة المرور الجديدة هنا...">
            </div>

            <div class="form-group">
                <label>الدور (الصلاحية):</label>
                <select name="role">
                    <option value="admin" {% if user_obj.profile.role == 'admin' %}selected{% endif %}>مدير النظام</option>
                    <option value="entry" {% if user_obj.profile.role == 'entry' %}selected{% endif %}>مدخل بيانات</option>
                    <option value="viewer" {% if user_obj.profile.role == 'viewer' %}selected{% endif %}>مشاهد</option>
                </select>
            </div>

            <button type="submit">💾 حفظ التعديلات</button>
            <a href="{% url 'user-list' %}" class="btn-cancel">إلغاء</a>
        </form>
    </div>
</body>
</html>
