<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إضافة مستخدم</title>
    <style>
        body { font-family: Tahoma; background: #f5f5f5; padding: 20px; display: flex; justify-content: center; }
        .box { background: white; padding: 30px; border-radius: 10px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn-cancel { background: #95a5a6; margin-top: 5px; text-align: center; text-decoration: none; display: block; color: white; padding: 12px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>➕ إضافة مستخدم جديد</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}:</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="form-group">
                <label>الدور (الصلاحية):</label>
                <select name="role" required>
                    <option value="viewer">مشاهد (يقرأ فقط)</option>
                    <option value="entry">مدخل بيانات (يضيف ويعدل)</option>
                    <option value="admin">مدير النظام (كل الصلاحيات)</option>
                </select>
            </div>
            <button type="submit">حفظ</button>
            <a href="{% url 'user-list' %}" class="btn-cancel">إلغاء</a>
        </form>
    </div>
</body>
</html>
