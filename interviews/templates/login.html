<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <style>
        body { font-family: Tahoma; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #34495e; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #219150; }
        .error { color: red; text-align: center; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>تسجيل الدخول</h2>
        {% if form.errors %}
            <p class="error">اسم المستخدم أو كلمة المرور غير صحيحة.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>اسم المستخدم:</label>
                <input type="text" name="username" required>
            </div>
                       <div class="form-group">
                <label>كلمة المرور:</label>
                <div style="position: relative;">
                    <input type="password" name="password" id="id_password" required style="width: 100%; padding: 10px; padding-left: 40px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                    <span onclick="togglePassword('id_password', this)" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; user-select: none;">👁️</span>
                </div>
            </div>
            <button type="submit">دخول</button>
            <div style="text-align: center; margin-top: 15px;">
    <a href="{% url 'signup' %}" style="color: #3498db; text-decoration: none;">ليس لديك حساب؟ إنشاء حساب جديد</a>
</div>
        </form>
    </div>
        <script>
        function togglePassword(fieldId, icon) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") {
                input.type = "text";
                icon.innerHTML = "🙈"; // عين مغمضة
            } else {
                input.type = "password";
                icon.innerHTML = "👁️"; // عين مفتوحة
            }
        }
    </script>
</body>
</html>
